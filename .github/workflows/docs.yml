name: Workspace docs and upstream pins
on:
  push:
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "CHECKLIST.md"
      - "docs/**"
      - "records/**"
      - "upstreams/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "CHECKLIST.md"
      - "docs/**"
      - "records/**"
      - "upstreams/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate links and SHA pins
        run: python3 scripts/verify_workspace.py
      - name: Offline script unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Simulated CLI and unknown template fail closed
        shell: bash
        run: |
          python3 scripts/validate_servos.py tests/fixtures/servos_simulated.json --mapping tests/fixtures/mapping_simulated.json --output "$RUNNER_TEMP/servo-simulated"
          result=0
          python3 scripts/validate_servos.py templates/hd1910_inventory.csv --mapping templates/hd1910_mapping.json --output "$RUNNER_TEMP/servo-unknown" || result=$?
          test "$result" -eq 2
